<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f7fbff"><link rel="manifest" href="./manifest.json"><title>BrighterVoice — Every Voice Matters</title><style>
*{box-sizing:border-box}body{margin:0;background:#f7fbff;color:#17324d;font-family:system-ui,-apple-system,sans-serif}.app{max-width:950px;margin:auto;padding:16px 14px 105px}header{display:grid;grid-template-columns:78px 1fr 78px;gap:8px;align-items:center}.brand{text-align:center}.brand h1{margin:0;color:#1768b0;font-size:clamp(24px,5vw,38px)}.brand small{color:#d99d00;font-weight:800}.nav{border:0;background:#fff;border-radius:16px;padding:10px 5px;box-shadow:0 6px 20px #16466f18;font-weight:800}.q{text-align:center;color:#286aab;font-size:clamp(22px,4vw,32px)}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.tile,.choice{border:0;border-radius:24px;min-height:125px;padding:12px;box-shadow:0 7px 20px #16466f1b;color:#17324d;font-weight:850;font-size:20px;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:8px}.tile i,.choice i{font-style:normal;font-size:48px}.green{background:#dff7e8}.blue{background:#dff0ff}.yellow{background:#fff1b8}.pink{background:#ffe0ea}.orange{background:#ffe6ca}.purple{background:#eee4ff}.red{background:#ffe0e0}.screen{display:none}.screen.on{display:block}.back{border:0;background:#fff;padding:12px 16px;border-radius:15px;font-weight:800}.choices{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.bar{position:fixed;bottom:0;left:0;right:0;padding:10px max(12px,calc((100vw - 950px)/2 + 14px)) calc(10px + env(safe-area-inset-bottom));background:#ffffffee;backdrop-filter:blur(10px);display:flex;gap:7px;border-top:1px solid #d9e7f3}.words{flex:1;min-height:58px;background:#fff;border:2px solid #dce8f3;border-radius:16px;padding:10px;display:flex;align-items:center;font-weight:800;overflow:auto}.bar button{border:0;border-radius:16px;padding:0 14px;font-weight:900}.speak{background:#1677ff;color:#fff}.clear{background:#edf3f8}.modal{display:none;position:fixed;inset:0;background:#17324d77;z-index:20;align-items:flex-end}.modal.on{display:flex}.panel{width:min(650px,100%);margin:auto;background:#fff;border-radius:26px 26px 0 0;padding:20px 18px calc(20px + env(safe-area-inset-bottom))}.panel input{width:100%;padding:12px;border:1px solid #ccd9e5;border-radius:12px}.panel button{border:0;border-radius:13px;padding:12px;font-weight:850}.row{display:flex;gap:8px;margin:10px 0}.row>*{flex:1}.primary{background:#1677ff;color:#fff}.secondary{background:#edf3f8}.hint{text-align:center;color:#687d91;font-size:13px}@media(max-width:650px){.grid{grid-template-columns:repeat(3,1fr)}.choices{grid-template-columns:repeat(2,1fr)}}@media(max-width:420px){.grid{grid-template-columns:repeat(2,1fr)}.tile{min-height:108px}}
</style></head><body><div class="app"><header><button class="nav" id="homeBtn">🏠<br>Home</button><div class="brand"><h1>☀️ BrighterVoice</h1><small>Every Voice Matters</small></div><button class="nav" id="settingsBtn">⚙️<br>Settings</button></header><main id="home" class="screen on"><h2 class="q">What do you want to say?</h2><div class="grid" id="categories"></div><p class="hint">Touch a button to speak, or open a category for more choices.</p></main><main id="cat" class="screen"><p><button class="back" id="back">← Back</button></p><h2 id="catTitle"></h2><div class="choices" id="choices"></div></main></div><div class="bar"><div class="words" id="words">Choose words…</div><button class="clear" id="clear">Clear</button><button class="speak" id="speak">🔊 Speak</button></div><div class="modal" id="modal"><div class="panel"><h2>⚙️ Settings</h2><label><b>Voice speed</b></label><input id="rate" type="range" min=".5" max="1.5" value="1" step=".1"><h3>Add a custom phrase</h3><div class="row"><input id="custom" placeholder="Example: I need a break"><button class="primary" id="add">Add</button></div><div id="customList"></div><button class="secondary" id="done" style="width:100%;margin-top:10px">Done</button></div></div><script>
const C=[['I want','🙋','green',[['Water','💧'],['Food','🍽️'],['Snack','🍎'],['Toy','🧸'],['Music','🎵'],['Outside','🌳'],['Break','⏸️']]],['I need','🤲','blue',[['Help','🆘'],['Bathroom','🚻'],['Quiet','🤫'],['More time','⏰'],['A break','⏸️'],['A hug','🤗'],['Space','↔️']]],['I feel','😊','yellow',[['Happy','😄'],['Sad','😢'],['Angry','😠'],['Scared','😨'],['Tired','😴'],['Sick','🤒'],['Excited','🤩']]],['People','👥','pink',[['Mom','👩'],['Dad','👨'],['Family','👪'],['Teacher','🧑‍🏫'],['Friend','🧑‍🤝‍🧑']]],['Food','🍽️','orange',[['Breakfast','🥞'],['Lunch','🥪'],['Dinner','🍲'],['Fruit','🍓'],['Snack','🍪'],['More','➕'],['All done','✅']]],['Drink','🥤','blue',[['Water','💧'],['Milk','🥛'],['Juice','🧃'],['More','➕'],['All done','✅']]],['Bathroom','🚻','purple',[['Bathroom','🚻'],['Privacy','🚪'],['Help','🆘'],['All done','✅']]],['Places','🏠','green',[['Home','🏠'],['School','🏫'],['Outside','🌳'],['Store','🛒'],['Car','🚗'],['Doctor','🏥']]],['Yes','✅','green'],['No','❌','red'],['Help','👐','purple'],['Stop','🛑','red']];let W=[];const $=x=>document.getElementById(x);function say(t){if(!('speechSynthesis'in window)){alert('Speech is not supported by this browser.');return}speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(t);u.rate=+$('rate').value;speechSynthesis.speak(u)}function drawW(){$('words').textContent=W.length?W.join(' '):'Choose words…'}function addW(t){W.push(t);drawW();say(t)}function home(){$('cat').classList.remove('on');$('home').classList.add('on')}function openCat(c){$('home').classList.remove('on');$('cat').classList.add('on');$('catTitle').textContent=c[1]+' '+c[0];$('choices').innerHTML='';c[3].forEach(x=>{let b=document.createElement('button');b.className='choice';b.innerHTML='<i>'+x[1]+'</i>'+x[0];b.onclick=()=>addW((['I want','I need','I feel'].includes(c[0])?c[0]+' '+x[0].toLowerCase():x[0]));$('choices').appendChild(b)})}function customs(){try{return JSON.parse(localStorage.getItem('bvCustom')||'[]')}catch(e){return[]}}function render(){let g=$('categories');g.innerHTML='';C.forEach(c=>{let b=document.createElement('button');b.className='tile '+c[2];b.innerHTML='<i>'+c[1]+'</i>'+c[0];b.onclick=()=>c[3]?openCat(c):addW(c[0]==='Help'?'Help me please':c[0]);g.appendChild(b)});customs().forEach(t=>{let b=document.createElement('button');b.className='tile blue';b.innerHTML='<i>💬</i>'+t;b.onclick=()=>addW(t);g.appendChild(b)});let l=$('customList');l.innerHTML='';customs().forEach((t,i)=>{let r=document.createElement('div');r.className='row';let p=document.createElement('button');p.className='secondary';p.textContent=t;p.onclick=()=>say(t);let d=document.createElement('button');d.className='secondary';d.textContent='Delete';d.onclick=()=>{let a=customs();a.splice(i,1);localStorage.setItem('bvCustom',JSON.stringify(a));render()};r.append(p,d);l.appendChild(r)})}$('homeBtn').onclick=home;$('back').onclick=home;$('clear').onclick=()=>{W=[];drawW()};$('speak').onclick=()=>W.length?say(W.join(' ')):say('Please choose some words');$('settingsBtn').onclick=()=>{$('modal').classList.add('on');render()};$('done').onclick=()=>$('modal').classList.remove('on');$('modal').onclick=e=>{if(e.target===$('modal'))$('modal').classList.remove('on')};$('add').onclick=()=>{let t=$('custom').value.trim();if(!t)return;let a=customs();a.push(t);localStorage.setItem('bvCustom',JSON.stringify(a));$('custom').value='';render()};render();drawW();
</script></body></html>
