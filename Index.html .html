<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f7fbff"><link rel="manifest" href="./manifest.json"><title>BrighterVoice — Every Voice Matters</title>
<style>*{box-sizing:border-box}body{margin:0;background:#f7fbff;color:#17324d;font-family:Arial,system-ui,sans-serif}.app{max-width:900px;margin:auto;padding:16px 16px 110px}header{display:flex;justify-content:space-between;align-items:center;gap:10px}.brand{text-align:center}.brand h1{margin:0;color:#1769aa;font-size:clamp(24px,5vw,38px)}.brand small{color:#d89d00;font-weight:700}.nav{border:0;background:#fff;padding:12px;border-radius:15px;box-shadow:0 4px 16px #0001;font-weight:700}h2{text-align:center;color:#286aab;margin:24px 0}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.tile,.choice{border:0;border-radius:22px;min-height:125px;padding:12px;box-shadow:0 5px 18px #2342;font-size:20px;font-weight:800;color:#17324d;background:#fff}.tile span,.choice span{display:block;font-size:45px;margin-bottom:8px}.green{background:#dff7e8}.blue{background:#dff0ff}.yellow{background:#fff1b8}.pink{background:#ffe0ea}.orange{background:#ffe6ca}.purple{background:#eee4ff}.red{background:#ffe0e0}#category{display:none}.top{display:flex;align-items:center;gap:15px}.choices{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.bar{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid #dce8f3;padding:10px;display:flex;gap:7px;align-items:center}.sentence{flex:1;min-height:58px;border:2px solid #dce8f3;border-radius:15px;padding:16px;font-weight:700}.speak,.clear{border:0;border-radius:15px;min-height:58px;padding:0 16px;font-weight:800}.speak{background:#1677ff;color:#fff}.clear{background:#edf3f8}@media(max-width:650px){.grid{grid-template-columns:repeat(3,1fr)}.choices{grid-template-columns:repeat(2,1fr)}}@media(max-width:430px){.grid{grid-template-columns:repeat(2,1fr)}.tile{min-height:105px}.nav{font-size:12px;padding:9px}}</style></head>
<body><div class="app"><header><button class="nav" onclick="goHome()">🏠<br>Home</button><div class="brand"><h1>☀️ BrighterVoice</h1><small>Every Voice Matters</small></div><button class="nav" onclick="speak('BrighterVoice')">🔊<br>Voice</button></header><section id="home"><h2>What do you want to say?</h2><div class="grid" id="grid"></div></section><section id="category"><div class="top"><button class="nav" onclick="goHome()">← Back</button><h2 id="title"></h2></div><div class="choices" id="choices"></div></section></div><div class="bar"><div class="sentence" id="sentence">Choose words…</div><button class="clear" onclick="clearWords()">Clear</button><button class="speak" onclick="speakSentence()">🔊 Speak</button></div>
<script>
const data=[["I want","🙋","green",[["Water","💧"],["Food","🍽️"],["Snack","🍎"],["Toy","🧸"],["Music","🎵"],["Outside","🌳"],["A break","⏸️"]]],["I need","🤲","blue",[["Help","🆘"],["Bathroom","🚻"],["Quiet","🤫"],["More time","⏰"],["A break","⏸️"],["A hug","🤗"]]],["I feel","😊","yellow",[["Happy","😄"],["Sad","😢"],["Angry","😠"],["Scared","😨"],["Tired","😴"],["Sick","🤒"]]],["People","👥","pink",[["Mom","👩"],["Dad","👨"],["Family","👪"],["Teacher","🧑‍🏫"],["Friend","🧑‍🤝‍🧑"]]],["Food","🍽️","orange",[["Breakfast","🥞"],["Lunch","🥪"],["Dinner","🍲"],["Fruit","🍓"],["Snack","🍪"]]],["Drink","🥤","blue",[["Water","💧"],["Milk","🥛"],["Juice","🧃"],["More","➕"]]],["Bathroom","🚻","purple",[["Bathroom","🚻"],["Privacy","🚪"],["Help","🆘"]]],["Places","🏠","green",[["Home","🏠"],["School","🏫"],["Outside","🌳"],["Store","🛒"],["Car","🚗"],["Doctor","🏥"]]],["Yes","✅","green",null],["No","❌","red",null],["Help","👐","purple",null],["Stop","🛑","red",null]];
let words=[];const el=id=>document.getElementById(id);
function speak(t){if(t&&"speechSynthesis"in window){speechSynthesis.cancel();speechSynthesis.speak(new SpeechSynthesisUtterance(t))}}
function update(){el("sentence").textContent=words.length?words.join(" "):"Choose words…"}
function add(t){words.push(t);update();speak(t)}
function clearWords(){words=[];update()}
function speakSentence(){speak(words.join(" "))}
function goHome(){el("home").style.display="block";el("category").style.display="none"}
function openCat(c){el("home").style.display="none";el("category").style.display="block";el("title").textContent=c[1]+" "+c[0];el("choices").innerHTML="";c[3].forEach(x=>{let b=document.createElement("button");b.className="choice";b.innerHTML="<span>"+x[1]+"</span>"+x[0];b.onclick=()=>add((["I want","I need","I feel"].includes(c[0])?c[0]+" ":"")+x[0].toLowerCase());el("choices").appendChild(b)})}
data.forEach(c=>{let b=document.createElement("button");b.className="tile "+c[2];b.innerHTML="<span>"+c[1]+"</span>"+c[0];b.onclick=()=>c[3]?openCat(c):add(c[0]);el("grid").appendChild(b)});
</script></body></html>
